name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add ?v=<content hash> to every CSS/JS link so visitors never run a
      # stale cached copy after an update
      - name: Stamp asset versions
        run: node scripts/stamp-assets.js

      # Only the public website gets deployed. The admin studio, build scripts
      # and internal docs stay in the repo but are never served on portal-music.com.
      - name: Remove non-public files
        run: |
          rm -rf admin scripts workers social covers music .github node_modules
          rm -f CLAUDE.md ADMIN_GUIDE.md README.md TODO.md package.json package-lock.json firestore.rules
          rm -f "how to add music to portal-music.docx"
          find . -name '*serviceAccount*.json' -delete

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
