<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Music — Portal Music</title>
  <meta name="description" content="Browse free royalty-free music by genre. Rock, Jazz, Hip-Hop, Electronic, Cinematic, Classical, Country, and more.">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5642457707478801"
          crossorigin="anonymous"></script>
</head>
<body>

  <div id="fav-banner" class="fav-banner">
    ❤️ &nbsp;Favorites are saved for this session only and will clear when you close this tab.
    <button id="fav-banner-dismiss" class="fav-banner-dismiss" title="Dismiss">✕</button>
  </div>

  <header>
    <a href="index.html" class="logo"><img src="images/portal-logo.svg" alt="" class="logo-img"> Portal Music</a>
    <nav class="nav-links">
      <a href="browse.html">Browse</a>
      <a href="browse.html?filter=favorites">Favorites</a>
      <a href="license.html">License</a>
    </nav>
    <div class="theme-btns">
      <button class="theme-btn" data-theme="dark"  title="Dark">🌙</button>
      <button class="theme-btn" data-theme="light" title="Light">☀️</button>
      <button class="theme-btn" data-theme="sepia" title="Sepia">📜</button>
    </div>
  </header>

  <div class="page-with-side-ads">
    <aside class="side-ad left-ad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5642457707478801"
           data-ad-slot="XXXXXXXXXX" data-ad-format="vertical" data-full-width-responsive="false"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </aside>

    <div class="container">

      <div class="browse-header">
        <h1 id="page-title">All Music</h1>
        <p class="browse-subtitle" id="page-subtitle"></p>
      </div>

      <!-- Genre filter chips (multi-select) -->
      <div class="browse-filters" id="browse-filters"></div>

      <!-- Active filters count + clear -->
      <div class="browse-active-bar" id="browse-active-bar" style="display:none;">
        <span id="browse-results-count"></span>
        <button class="browse-clear-btn" id="browse-clear-btn">Clear filters</button>
      </div>

      <!-- Ad Slot -->
      <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5642457707478801"
             data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <!-- Track grid -->
      <div class="grid" id="music-grid">
        <div class="empty-state"><div class="empty-icon">🎵</div><p>Loading tracks…</p></div>
      </div>

    </div>

    <aside class="side-ad right-ad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5642457707478801"
           data-ad-slot="XXXXXXXXXX" data-ad-format="vertical" data-full-width-responsive="false"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </aside>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2025 Portal Music. All tracks are free to use.</p>
      <div class="footer-links">
        <a href="license.html">License</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <!-- Player Bar -->
  <div id="player-bar">
    <div class="player-art" id="player-art">🎵</div>
    <div class="player-info">
      <div class="player-title"  id="player-title">Select a track</div>
      <div class="player-artist" id="player-artist"></div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="play-pause-btn">▶</button>
    </div>
    <div class="player-progress">
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="player-time" id="player-time">0:00 / 0:00</div>
    </div>
    <button class="player-fav" id="player-fav-btn">🤍</button>
  </div>

  <script src="js/app.js"></script>
  <script>
    var params       = new URLSearchParams(window.location.search);
    var genre        = params.get('genre');
    var subgenreParam = params.get('subgenre');
    var artist       = params.get('artist');
    var filterMode   = params.get('filter');
    var allSongsPage = [];
    var activeFilters = []; // array of subgenre strings

    // --- Build genre/subgenre chip grid (multi-select) ---
    function renderBrowseFilters(songs) {
      var filtersEl = document.getElementById('browse-filters');
      if (genre || artist || filterMode) {
        filtersEl.style.display = 'none';
        return;
      }

      // Count per subgenre
      var subCounts = {};
      songs.forEach(function(s) {
        if (s.subgenre) subCounts[s.subgenre] = (subCounts[s.subgenre] || 0) + 1;
      });

      var html = '';
      Object.entries(GENRES).forEach(function(entry) {
        var g = entry[0], info = entry[1];
        var totalCount = 0;
        info.subgenres.forEach(function(sub) { totalCount += (subCounts[sub] || 0); });

        html += '<div class="filter-genre-group">';
        html += '<div class="filter-genre-header">';
        html += '<span class="filter-genre-icon">' + info.icon + '</span>';
        html += '<span class="filter-genre-name">' + g + '</span>';
        html += '<span class="filter-genre-count">' + totalCount + '</span>';
        html += '</div>';
        html += '<div class="filter-genre-chips">';
        info.subgenres.forEach(function(sub) {
          var c = subCounts[sub] || 0;
          html += '<button class="chip browse-chip" data-sub="' + sub.replace(/"/g, '') + '">' +
            sub + ' <span class="chip-count">' + c + '</span></button>';
        });
        html += '</div></div>';
      });

      filtersEl.innerHTML = html;

      // If subgenre param from URL, pre-select it
      if (subgenreParam) {
        activeFilters = [subgenreParam];
        var preBtn = filtersEl.querySelector('.browse-chip[data-sub="' + subgenreParam + '"]');
        if (preBtn) preBtn.classList.add('active');
      }

      // Click handlers - multi-select toggle
      filtersEl.querySelectorAll('.browse-chip').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var sub = btn.dataset.sub;
          var idx = activeFilters.indexOf(sub);
          if (idx >= 0) {
            activeFilters.splice(idx, 1);
            btn.classList.remove('active');
          } else {
            activeFilters.push(sub);
            btn.classList.add('active');
          }
          renderFilteredGrid();
        });
      });
    }

    // --- Clear filters ---
    document.getElementById('browse-clear-btn').addEventListener('click', function() {
      activeFilters = [];
      document.querySelectorAll('.browse-chip.active').forEach(function(b) {
        b.classList.remove('active');
      });
      renderFilteredGrid();
    });

    // --- Render grid based on active filters ---
    function renderFilteredGrid() {
      var bar = document.getElementById('browse-active-bar');
      var gridEl = document.getElementById('music-grid');
      var countEl = document.getElementById('browse-results-count');

      if (activeFilters.length === 0) {
        bar.style.display = 'none';
        gridEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div>' +
          '<p>Select one or more genres above to browse tracks.</p></div>';
        return;
      }

      var filtered = allSongsPage.filter(function(s) {
        return activeFilters.indexOf(s.subgenre) !== -1;
      });

      bar.style.display = 'flex';
      countEl.textContent = filtered.length + ' track' + (filtered.length !== 1 ? 's' : '') +
        ' in ' + activeFilters.length + ' filter' + (activeFilters.length !== 1 ? 's' : '');

      gridEl.style.display = '';
      gridEl.innerHTML = filtered.length
        ? filtered.map(createTrackCard).join('')
        : '<div class="empty-state"><div class="empty-icon">😔</div><p>No tracks found.</p></div>';
    }

    // --- Render simple grid (for genre/artist/favorites views) ---
    function renderSimpleGrid(songs) {
      var gridEl = document.getElementById('music-grid');
      gridEl.style.display = '';
      gridEl.innerHTML = songs.length
        ? songs.map(createTrackCard).join('')
        : '<div class="empty-state"><div class="empty-icon">😔</div><p>No tracks found.</p></div>';
    }

    // --- Main load ---
    loadSongs().then(function(songs) {
      var titleEl    = document.getElementById('page-title');
      var subtitleEl = document.getElementById('page-subtitle');
      allSongsPage = songs;

      if (filterMode === 'favorites') {
        var favIds = getFavorites();
        titleEl.textContent = '❤️ Favorites';
        subtitleEl.textContent = 'Your session favorites — clears when you close this tab.';
        var favSongs = songs.filter(function(s) { return favIds.indexOf(String(s.id)) !== -1; });
        if (favSongs.length === 0) {
          document.getElementById('music-grid').innerHTML =
            '<div class="empty-state"><div class="empty-icon">🤍</div>' +
            '<p>No favorites yet — tap 🤍 on any track to save it.</p></div>';
        } else {
          renderSimpleGrid(favSongs);
        }

      } else if (genre) {
        titleEl.textContent = genre;
        var genreInfo = GENRES[genre];
        if (genreInfo) subtitleEl.textContent = genreInfo.subgenres.join(' · ');
        var genreSongs = songs.filter(function(s) {
          if (genreInfo) {
            return genreInfo.subgenres.indexOf(s.subgenre) !== -1 || s.genre === genre;
          }
          return s.genre === genre;
        });
        renderBrowseFilters(songs);
        // Pre-select this genre's subgenres
        if (genreInfo) {
          activeFilters = genreInfo.subgenres.slice();
          document.querySelectorAll('.browse-chip').forEach(function(btn) {
            if (activeFilters.indexOf(btn.dataset.sub) !== -1) btn.classList.add('active');
          });
        }
        renderSimpleGrid(genreSongs);

      } else if (artist) {
        titleEl.textContent = artist;
        subtitleEl.textContent = 'All tracks by ' + artist;
        var artistSongs = songs.filter(function(s) { return s.artist === artist; });
        renderSimpleGrid(artistSongs);

      } else {
        titleEl.textContent = 'Browse Music';
        subtitleEl.textContent = songs.length + ' tracks available. Select genres to filter.';
        renderBrowseFilters(songs);
        renderFilteredGrid();
      }
    });
  </script>
</body>
</html>
