<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Music — Portal Music</title>
  <meta name="description" content="Browse free royalty-free music by genre. Rock, Jazz, Hip-Hop, Electronic, Cinematic, Classical, Country, and more.">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5642457707478801"
          crossorigin="anonymous"></script>
</head>
<body>

  <div id="fav-banner" class="fav-banner">
    ❤️ &nbsp;Favorites are saved for this session only and will clear when you close this tab.
    <button id="fav-banner-dismiss" class="fav-banner-dismiss" title="Dismiss">✕</button>
  </div>

  <header>
    <a href="index.html" class="logo"><span class="portal-emoji">🕳️</span> Portal Music</a>
    <nav class="nav-links">
      <a href="browse.html">Browse</a>
      <a href="browse.html?filter=favorites">Favorites</a>
      <a href="license.html">License</a>
    </nav>
    <div class="theme-btns">
      <button class="theme-btn" data-theme="dark"  title="Dark">🌙</button>
      <button class="theme-btn" data-theme="light" title="Light">☀️</button>
      <button class="theme-btn" data-theme="sepia" title="Sepia">📜</button>
    </div>
  </header>

  <div class="page-with-side-ads">
    <aside class="side-ad left-ad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5642457707478801"
           data-ad-slot="XXXXXXXXXX" data-ad-format="vertical" data-full-width-responsive="false"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </aside>

    <div class="container">

      <div class="browse-header">
        <h1 id="page-title">All Music</h1>
        <p class="browse-subtitle" id="page-subtitle"></p>
      </div>

      <!-- Genre Accordion (shown when no specific genre/artist selected) -->
      <div id="genre-accordion" class="genre-accordion"></div>

      <!-- Sub-genre / filter chips (shown when browsing a genre) -->
      <div class="subgenre-filters" id="subgenre-filters" style="display:none;"></div>

      <!-- Ad Slot -->
      <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5642457707478801"
             data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <!-- Track grid -->
      <div class="grid" id="music-grid">
        <div class="empty-state"><div class="empty-icon">🎵</div><p>Loading tracks…</p></div>
      </div>

    </div>

    <aside class="side-ad right-ad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5642457707478801"
           data-ad-slot="XXXXXXXXXX" data-ad-format="vertical" data-full-width-responsive="false"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </aside>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2025 Portal Music. All tracks are free to use.</p>
      <div class="footer-links">
        <a href="license.html">License</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <!-- Player Bar -->
  <div id="player-bar">
    <div class="player-art">🎵</div>
    <div class="player-info">
      <div class="player-title"  id="player-title">Select a track</div>
      <div class="player-artist" id="player-artist"></div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="play-pause-btn">▶</button>
    </div>
    <div class="player-progress">
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="player-time" id="player-time">0:00 / 0:00</div>
    </div>
    <button class="player-fav" id="player-fav-btn">🤍</button>
  </div>

  <script src="js/app.js"></script>
  <script>
    var params       = new URLSearchParams(window.location.search);
    var genre        = params.get('genre');
    var subgenreParam = params.get('subgenre');
    var artist       = params.get('artist');
    var filterMode   = params.get('filter');
    var activeSub    = 'all';
    var pageSongs    = [];

    // --- Genre Accordion (all genres with slide-down subgenres) ---
    function renderAccordion(songs) {
      var accordion = document.getElementById('genre-accordion');
      if (genre || artist || filterMode) {
        accordion.style.display = 'none';
        return;
      }

      // Count per subgenre
      var subCounts = {};
      songs.forEach(function(s) {
        if (s.subgenre) subCounts[s.subgenre] = (subCounts[s.subgenre] || 0) + 1;
      });

      accordion.innerHTML = Object.entries(GENRES).map(function(entry) {
        var g = entry[0], info = entry[1];
        var totalCount = 0;
        info.subgenres.forEach(function(sub) { totalCount += (subCounts[sub] || 0); });

        var subItems = info.subgenres.map(function(sub) {
          var c = subCounts[sub] || 0;
          return '<a href="browse.html?genre=' + encodeURIComponent(g) +
            '&subgenre=' + encodeURIComponent(sub) +
            '" class="accordion-sub-item">' +
            '<span>' + sub + '</span>' +
            '<span class="sub-count">' + c + '</span>' +
          '</a>';
        }).join('');

        return '<div class="accordion-item">' +
          '<button class="accordion-trigger" data-genre="' + g + '">' +
            '<span class="accordion-icon">' + info.icon + '</span>' +
            '<span class="accordion-label">' + g + '</span>' +
            '<span class="accordion-count">' + totalCount + ' tracks</span>' +
            '<span class="accordion-arrow">▸</span>' +
          '</button>' +
          '<div class="accordion-panel">' + subItems + '</div>' +
        '</div>';
      }).join('');

      // Click handlers
      accordion.querySelectorAll('.accordion-trigger').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var item = btn.parentElement;
          var wasOpen = item.classList.contains('open');
          // Close all
          accordion.querySelectorAll('.accordion-item.open').forEach(function(el) {
            el.classList.remove('open');
          });
          // Toggle this one
          if (!wasOpen) item.classList.add('open');
        });
      });
    }

    // --- Render sub-genre filter chips ---
    function renderSubgenreFilters(songs) {
      var filtersEl = document.getElementById('subgenre-filters');
      var subs = [];
      songs.forEach(function(s) {
        if (s.subgenre && subs.indexOf(s.subgenre) === -1) subs.push(s.subgenre);
      });
      if (subs.length < 2) { filtersEl.style.display = 'none'; return; }

      filtersEl.style.display = 'flex';
      filtersEl.innerHTML =
        '<button class="chip active" data-sub="all">All</button>' +
        subs.map(function(s) {
          var isActive = (s === subgenreParam) ? ' active' : '';
          return '<button class="chip' + isActive + '" data-sub="' + s.replace(/"/g, '') + '">' + s + '</button>';
        }).join('');

      // If subgenre param set, activate it
      if (subgenreParam) {
        activeSub = subgenreParam;
        filtersEl.querySelector('.chip[data-sub="all"]').classList.remove('active');
      }

      filtersEl.querySelectorAll('.chip').forEach(function(btn) {
        btn.addEventListener('click', function() {
          activeSub = btn.dataset.sub;
          filtersEl.querySelectorAll('.chip').forEach(function(b) {
            b.classList.toggle('active', b.dataset.sub === activeSub);
          });
          renderGrid();
        });
      });
    }

    // --- Render track grid ---
    function renderGrid() {
      var songs = activeSub === 'all'
        ? pageSongs
        : pageSongs.filter(function(s) { return s.subgenre === activeSub; });

      document.getElementById('music-grid').innerHTML = songs.length
        ? songs.map(createTrackCard).join('')
        : '<div class="empty-state"><div class="empty-icon">😔</div><p>No tracks in this sub-genre yet.</p></div>';
    }

    // --- Main load ---
    loadSongs().then(function(songs) {
      var titleEl    = document.getElementById('page-title');
      var subtitleEl = document.getElementById('page-subtitle');

      if (filterMode === 'favorites') {
        var favIds = getFavorites();
        titleEl.textContent = '❤️ Favorites';
        subtitleEl.textContent = 'Your session favorites — clears when you close this tab.';
        pageSongs = songs.filter(function(s) { return favIds.indexOf(String(s.id)) !== -1; });
        if (pageSongs.length === 0) {
          document.getElementById('music-grid').innerHTML =
            '<div class="empty-state"><div class="empty-icon">🤍</div>' +
            '<p>No favorites yet — tap 🤍 on any track to save it.</p></div>';
          return;
        }

      } else if (genre) {
        titleEl.textContent = genre;
        var genreInfo = GENRES[genre];
        if (genreInfo) subtitleEl.textContent = genreInfo.subgenres.join(' · ');
        // Filter to songs in this parent genre's subgenres
        pageSongs = songs.filter(function(s) {
          if (genreInfo) {
            return genreInfo.subgenres.indexOf(s.subgenre) !== -1 || s.genre === genre;
          }
          return s.genre === genre;
        });

      } else if (artist) {
        titleEl.textContent = artist;
        subtitleEl.textContent = 'All tracks by ' + artist;
        pageSongs = songs.filter(function(s) { return s.artist === artist; });

      } else {
        titleEl.textContent = 'Browse All Genres';
        subtitleEl.textContent = songs.length + ' tracks available. Click a genre to expand.';
        pageSongs = songs;
      }

      renderAccordion(songs);
      renderSubgenreFilters(pageSongs);
      renderGrid();

      // If browsing all (no filter), hide the track grid initially
      if (!genre && !artist && !filterMode) {
        document.getElementById('music-grid').style.display = 'none';
      }
    });
  </script>
</body>
</html>
