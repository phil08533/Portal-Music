<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo"><strong>AI Music Hub</strong></div>
        <nav>
            <a href="browse.html" class="chip">Browse All</a>
            <button onclick="setTheme('light')">☀</button>
            <button onclick="setTheme('dark')">🌙</button>
            <button onclick="setTheme('sepia')">📜</button>
        </nav>
    </header>

    <div class="container">
        <div class="search-container">
            <h1>Free AI Music for Creators</h1>
            <form action="search.html" method="GET">
                <input type="text" name="q" placeholder="Search by mood, genre, or title..." required>
            </form>
        </div>

        <nav class="category-nav">
            <a href="browse.html?cat=Orchestral" class="chip">Orchestral</a>
            <a href="browse.html?cat=ChillHop" class="chip">Chill Hop</a>
            <a href="browse.html?cat=Medieval" class="chip">Medieval</a>
            <a href="browse.html?cat=Sci-Fi" class="chip">Sci-Fi</a>
        </nav>

        <h3>Featured Tracks</h3>
        <div id="featured-grid" class="grid"></div>

        <h3 id="recent-header" style="display:none;">Recently Played</h3>
        <div id="recent-grid" class="grid"></div>
    </div>

    <div id="player-bar">
        <div style="flex-grow: 1;">
            <strong id="now-playing-title">Select a track</strong><br>
            <small id="now-playing-cat"></small>
        </div>
        <button id="play-pause-btn" onclick="togglePlay()">Play</button>
        <input type="range" id="progress-bar" value="0" style="flex-grow: 2;">
    </div>

    <script src="js/main.js"></script>
    <script>
        // Load Featured tracks (first 3 in JSON)
        fetch('data/music.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('featured-grid').innerHTML = 
                    data.slice(0, 3).map(createTrackCard).join('');
            });

        // Show recently played if they exist
        const recent = JSON.parse(localStorage.getItem('recent') || '[]');
        if(recent.length > 0) {
            document.getElementById('recent-header').style.display = 'block';
            document.getElementById('recent-grid').innerHTML = 
                recent.map(createTrackCard).join('');
        }
    </script>
</body>
</html>
